<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时间戳/时区转换器</title>
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <style>
    .wrap { padding:12px; border-bottom:1px solid var(--border); background: rgba(10,16,34,.6); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .main { padding:16px; display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    .card { background: var(--surface-lowest); border:1px solid var(--border); border-radius:12px; padding:16px; }
    .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
    input, select { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-low); color:var(--text); width:100%; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface-low); color:var(--text); cursor:pointer; transition: transform .12s ease, filter .15s ease; }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .btn:active { transform: translateY(0); filter: brightness(.95); }
    .btn.primary { background: var(--primary); border-color: transparent; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .flash { box-shadow: 0 0 0 3px rgba(95,212,255,.35) inset; }
  </style>
</head>
<body>
  <header class="tool-header" data-site-header>
    <a class="back" href="../../index.html">&lt; 返回首页</a>
    <div class="tool-title">时间戳/时区转换器</div>
    <div class="tool-bar"><button type="button" data-language-toggle>中 / EN</button></div>
  </header>

  <div class="wrap">
    <button id="now" class="btn" data-i18n="time.now">获取当前时间</button>
    <select id="tz">
      <option value="Asia/Shanghai">Asia/Shanghai</option>
      <option value="UTC">UTC</option>
      <option value="America/Los_Angeles">America/Los_Angeles</option>
      <option value="Europe/London">Europe/London</option>
      <option value="Asia/Tokyo">Asia/Tokyo</option>
    </select>
    <button id="copyUnix" class="btn" data-i18n="time.copyUnix">复制 Unix</button>
    <button id="copyISO" class="btn" data-i18n="time.copyISO">复制 ISO</button>
  </div>

  <div class="main">
    <div class="card">
      <div class="row"><strong data-i18n="time.unix">Unix 时间戳（秒）</strong></div>
      <div class="row"><input id="unix" class="mono" placeholder="例如 1717139200" data-i18n-placeholder="time.unixExample" /></div>
      <div class="row"><button id="u2d" class="btn primary" data-i18n="time.toDate">转为日期</button></div>
    </div>
    <div class="card">
      <div class="row"><strong data-i18n="time.date">日期时间（ISO 或 yyyy-MM-dd HH:mm:ss）</strong></div>
      <div class="row"><input id="iso" class="mono" placeholder="例如 2025-01-01 12:34:56 或 2025-01-01T12:34:56" data-i18n-placeholder="time.dateExample" /></div>
      <div class="row" style="gap:12px;">
        <button id="d2u" class="btn primary" data-i18n="time.toUnix">转为 Unix</button>
        <button id="toFmt" class="btn" data-i18n="time.toFormat">转为 yyyy-MM-dd HH:mm:ss</button>
      </div>
      <div class="row"><div id="pretty" class="mono" style="opacity:.9;"></div></div>
    </div>
  </div>

  <script>
    const unixInput = document.getElementById('unix');
    const isoInput = document.getElementById('iso');
    const pretty = document.getElementById('pretty');
    const tzSel = document.getElementById('tz');
    const locale = () => window.ToolkitI18n && ToolkitI18n.getLanguage() === 'en' ? 'en-US' : 'zh-CN';
    const fmt = (d) => new Intl.DateTimeFormat(locale(), { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, timeZone: tzSel.value }).format(d);

    // 默认时区
    tzSel.value = 'Asia/Shanghai';

    function toISODate(str){
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(str)) {
        const [d,t] = str.split(' '); return d + 'T' + t;
      }
      return str;
    }

    function updatePretty(d){
      try { pretty.textContent = fmt(d) + '  [' + tzSel.value + ']'; } catch { pretty.textContent = ''; }
    }

    function formatYmdHms(d){
      try {
        const parts = new Intl.DateTimeFormat(locale(), {
          timeZone: tzSel.value,
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).formatToParts(d).reduce((m,p)=>{ m[p.type]=p.value; return m; },{});
        return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
      } catch { return ''; }
    }

    function flash(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 600); }

    document.getElementById('u2d').onclick = () => {
      const v = Number(unixInput.value.trim()); if (!Number.isFinite(v)) return;
      const d = new Date(v * 1000);
      isoInput.value = d.toISOString();
      updatePretty(d);
      flash(isoInput);
    };

    document.getElementById('d2u').onclick = () => {
      const raw = toISODate(isoInput.value.trim());
      const d = new Date(raw);
      if (isNaN(d)) return;
      unixInput.value = Math.floor(d.getTime()/1000);
      updatePretty(d);
      flash(unixInput);
    };

    document.getElementById('now').onclick = () => {
      const d = new Date();
      unixInput.value = Math.floor(d.getTime()/1000);
      isoInput.value = d.toISOString();
      updatePretty(d);
    };

    document.getElementById('toFmt').onclick = () => {
      let d; const raw = isoInput.value.trim();
      if (raw) d = new Date(toISODate(raw));
      if (!raw || isNaN(d)) {
        const u = Number(unixInput.value); d = Number.isFinite(u) ? new Date(u*1000) : new Date();
      }
      const txt = formatYmdHms(d);
      if (txt) { isoInput.value = txt; flash(isoInput); }
    };

    async function copyWithFeedback(btn, text){
      try { await navigator.clipboard.writeText(text || ''); btn.textContent = ToolkitI18n.translate('common.copied'); setTimeout(()=>ToolkitI18n.translatePage(), 900);} catch(_){}
    }
    document.getElementById('copyUnix').onclick = () => copyWithFeedback(document.getElementById('copyUnix'), unixInput.value);
    document.getElementById('copyISO').onclick = () => copyWithFeedback(document.getElementById('copyISO'), isoInput.value);

    tzSel.addEventListener('change', () => { const d = new Date( (Number(unixInput.value)||Math.floor(Date.now()/1000))*1000 ); updatePretty(d); });
    // 初始化
    document.getElementById('now').click();
  </script>
  <script src="../../assets/js/i18n.js"></script><script>ToolkitI18n.registerTranslations({'zh-CN':{'time.now':'获取当前时间','time.copyUnix':'复制 Unix','time.copyISO':'复制 ISO','time.unix':'Unix 时间戳（秒）','time.toDate':'转为日期','time.date':'日期时间（ISO 或 yyyy-MM-dd HH:mm:ss）','time.toUnix':'转为 Unix','time.toFormat':'转为 yyyy-MM-dd HH:mm:ss','common.copied':'已复制'},en:{'time.now':'Use current time','time.copyUnix':'Copy Unix','time.copyISO':'Copy ISO','time.unix':'Unix timestamp (seconds)','time.toDate':'Convert to date','time.date':'Date and time (ISO or yyyy-MM-dd HH:mm:ss)','time.toUnix':'Convert to Unix','time.toFormat':'Format as yyyy-MM-dd HH:mm:ss','common.copied':'Copied'}});document.addEventListener('toolkit:languagechange',()=>{const d=new Date((Number(document.getElementById('unix').value)||Math.floor(Date.now()/1000))*1000);updatePretty(d)});window.ToolkitPage={root:'../../',tool:true,titleZh:'时间戳/时区转换器',titleEn:'Timestamp & Timezone'};</script><script src="../../assets/js/site-shell.js"></script>
  <script>ToolkitI18n.registerTranslations({'zh-CN':{'time.unixExample':'例如 1717139200','time.dateExample':'例如 2025-01-01 12:34:56 或 2025-01-01T12:34:56'},en:{'time.unixExample':'Example: 1717139200','time.dateExample':'Example: 2025-01-01 12:34:56 or 2025-01-01T12:34:56'}});ToolkitI18n.translatePage()</script>
</body>
</html>
