<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片裁剪（CropperJS）</title>
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/vendor/cropper/cropper.min.css" />
  <style>
    .panel { padding:12px; border-bottom:1px solid var(--border); background: rgba(10,16,34,.6); display:flex; gap:8px; align-items:center; }
    .panel input[type=file] { color:#9aa3ba; }
    .work { display:flex; gap:12px; padding:12px; height: calc(100vh - 112px); }
    .left { flex: 2; background:var(--surface-lowest); border:1px solid var(--border); border-radius: 12px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .right { flex: 1; display:flex; flex-direction:column; gap:12px; }
    .preview { flex:1; min-height:0; padding:12px; background:var(--surface-lowest); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:grid; place-items:center; }
    .preview canvas { display:block; max-width:none; max-height:none; }
    .preview-info { color:var(--muted); font:12px var(--mono); text-align:center; }
    .actions { display:flex; gap:8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="tool-header" data-site-header>
    <a class="back" href="../../index.html">&lt; 返回首页</a>
    <div class="tool-title">图片裁剪（CropperJS）</div>
    <div class="tool-bar"><button type="button" data-language-toggle>中 / EN</button></div>
  </header>
  <div class="panel">
    <input id="file" type="file" accept="image/*" />
    <button class="button" id="rotateL">左转90°</button>
    <button class="button" id="rotateR">右转90°</button>
    <button class="button" id="flipH">水平翻转</button>
    <button class="button" id="reset">重置</button>
    <button class="button primary" id="export">导出PNG</button>
  </div>
  <div class="work">
    <div class="left"><img id="img" style="max-width:100%; display:none;" /></div>
    <div class="right">
      <div class="preview"><canvas id="previewCanvas" width="0" height="0"></canvas></div>
      <div class="preview-info" id="previewInfo">框选后显示实际裁剪尺寸（小图不会放大）</div>
      <div class="actions"></div>
    </div>
  </div>

  <script src="../../assets/vendor/cropper/cropper.min.js"></script>
  <script>
    const img = document.getElementById('img');
    const file = document.getElementById('file');
    const preview = document.querySelector('.preview');
    const previewCanvas = document.getElementById('previewCanvas');
    const previewInfo = document.getElementById('previewInfo');
    const previewContext = previewCanvas.getContext('2d');
    let cropper;
    let previewFrame = 0;
    let currentObjectUrl = '';

    function fitPreview() {
      if (!previewCanvas.width || !previewCanvas.height) return;
      const maxWidth = Math.max(1, preview.clientWidth - 24);
      const maxHeight = Math.max(1, preview.clientHeight - 24);
      const scale = Math.min(1, maxWidth / previewCanvas.width, maxHeight / previewCanvas.height);
      previewCanvas.style.width = Math.round(previewCanvas.width * scale) + 'px';
      previewCanvas.style.height = Math.round(previewCanvas.height * scale) + 'px';
    }

    function renderPreview() {
      cancelAnimationFrame(previewFrame);
      previewFrame = requestAnimationFrame(() => {
        if (!cropper) return;
        const result = cropper.getCroppedCanvas({ imageSmoothingEnabled:true, imageSmoothingQuality:'high' });
        if (!result) return;
        previewCanvas.width = result.width;
        previewCanvas.height = result.height;
        previewContext.drawImage(result, 0, 0);
        previewInfo.textContent = `${result.width} × ${result.height} px · 1:1 预览（大图自动缩小）`;
        fitPreview();
      });
    }

    file.addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      const url = URL.createObjectURL(f);
      currentObjectUrl = url;
      img.src = url; img.style.display='block';
      if (cropper) cropper.destroy();
      cropper = new Cropper(img, { viewMode:1, autoCropArea:0.9, background:false, ready:renderPreview, crop:renderPreview });
    });

    document.getElementById('rotateL').onclick = () => cropper?.rotate(-90);
    document.getElementById('rotateR').onclick = () => cropper?.rotate(90);
    document.getElementById('flipH').onclick = () => {
      if (!cropper) return; const d = cropper.getData();
      cropper.scaleX(d.scaleX === 1 ? -1 : 1);
    };
    document.getElementById('reset').onclick = () => cropper?.reset();
    document.getElementById('export').onclick = () => {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ imageSmoothingEnabled: true, imageSmoothingQuality: 'high' });
      canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'crop.png'; a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
    };
    window.addEventListener('beforeunload', () => {
      cancelAnimationFrame(previewFrame);
      cropper?.destroy();
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    });
    window.addEventListener('resize', fitPreview);
  </script>
  <script src="../../assets/js/i18n.js"></script><script>window.ToolkitPage={root:'../../',tool:true,title:'图片裁剪 / Image Cropper'};</script><script src="../../assets/js/site-shell.js"></script>
</body>
</html>
