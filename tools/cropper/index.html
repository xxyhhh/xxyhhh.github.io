<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片裁剪（CropperJS）</title>
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" />
  <style>
    .panel { padding:12px; border-bottom:1px solid var(--border); background: rgba(10,16,34,.6); display:flex; gap:8px; align-items:center; }
    .panel input[type=file] { color:#9aa3ba; }
    .work { display:flex; gap:12px; padding:12px; height: calc(100vh - 112px); }
    .left { flex: 2; background:#0a122c; border:1px solid var(--border); border-radius: 12px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .right { flex: 1; display:flex; flex-direction:column; gap:12px; }
    .preview { flex:1; background:#0a122c; border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; }
    .preview img { max-width:100%; }
    .actions { display:flex; gap:8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="tool-header">
    <a class="back" href="../../index.html">&lt; 返回首页</a>
    <div class="tool-title">图片裁剪（CropperJS）</div>
    <div class="tool-bar"><a class="button" href="https://github.com/fengyuanchen/cropperjs" target="_blank">GitHub</a></div>
  </header>
  <div class="panel">
    <input id="file" type="file" accept="image/*" />
    <button class="button" id="rotateL">左转90°</button>
    <button class="button" id="rotateR">右转90°</button>
    <button class="button" id="flipH">水平翻转</button>
    <button class="button" id="reset">重置</button>
    <button class="button primary" id="export">导出PNG</button>
  </div>
  <div class="work">
    <div class="left"><img id="img" style="max-width:100%; display:none;" /></div>
    <div class="right">
      <div class="preview"><img id="thumb" /></div>
      <div class="actions"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script>
    const img = document.getElementById('img');
    const file = document.getElementById('file');
    const thumb = document.getElementById('thumb');
    let cropper;
    let currentObjectUrl = '';

    file.addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      const url = URL.createObjectURL(f);
      currentObjectUrl = url;
      img.src = url; img.style.display='block';
      if (cropper) cropper.destroy();
      cropper = new Cropper(img, { viewMode:1, preview: thumb.parentElement, autoCropArea: 0.9, background:false });
    });

    document.getElementById('rotateL').onclick = () => cropper?.rotate(-90);
    document.getElementById('rotateR').onclick = () => cropper?.rotate(90);
    document.getElementById('flipH').onclick = () => {
      if (!cropper) return; const d = cropper.getData();
      cropper.scaleX(d.scaleX === 1 ? -1 : 1);
    };
    document.getElementById('reset').onclick = () => cropper?.reset();
    document.getElementById('export').onclick = () => {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ imageSmoothingEnabled: true, imageSmoothingQuality: 'high' });
      canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'crop.png'; a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
    };
    window.addEventListener('beforeunload', () => {
      cropper?.destroy();
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    });
  </script>
</body>
</html>
