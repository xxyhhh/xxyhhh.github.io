<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证件照制作 / ID Photo Maker</title><link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="./styles.css"></head><body><header data-site-header><a class="back" href="../../index.html">&lt; 返回首页</a><button data-language-toggle>中 / EN</button></header><main class="workbench"><div class="steps"><span class="step active">1. 上传照片</span><span class="step">2. 尺寸裁剪</span><span class="step">3. 智能抠图</span><span class="step">4. 换底导出</span></div><div class="id-layout"><aside class="id-panel"><h2 data-i18n="id.settings">证件照设置</h2><label class="upload" for="photo"><span data-i18n="id.upload">点击选择 JPG、PNG 或 WebP 照片（最大 10MB）</span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><label class="field"><span data-i18n="id.size">照片尺寸</span><select id="size"></select></label><label class="field"><span data-i18n="id.zoom">人物缩放</span><input id="zoom" type="range" min="1" max="3" value="1" step=".01"></label><label class="field"><span data-i18n="id.background">背景颜色</span><span class="colors" id="colors"></span></label><div class="actions"><button class="button primary" id="cutout" type="button" data-i18n="id.cutout">智能抠图</button><button class="button" id="clear" type="button" data-i18n="id.clear">清空</button></div><p class="status" id="status" data-i18n="id.private">照片只在当前页面内存中处理</p></aside><section class="id-panel"><h2 data-i18n="id.preview">预览与构图</h2><div class="stage"><canvas id="canvas" width="295" height="413"></canvas><span class="guide"></span></div><div class="actions" style="margin-top:14px"><button class="button primary" id="download" disabled data-i18n="id.download">下载证件照</button></div></section></div></main><script src="../../assets/js/i18n.js"></script><script>window.ToolkitPage={root:'../../',tool:true,title:'证件照制作 / ID Photo Maker'};</script><script src="../../assets/js/site-shell.js
