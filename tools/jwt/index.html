<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JWT 在线解码与校验（不上传）</title>
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <style>
    .toolbar { padding:12px; border-bottom:1px solid var(--border); background: rgba(10,16,34,.6); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .layout { padding:16px; display:grid; gap:16px; grid-template-columns: 1fr 1fr; }
    .full { grid-column: 1 / -1; }
    textarea, input, select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-low); color:var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .card { border:1px solid var(--border); border-radius:12px; background:var(--surface-lowest); padding:16px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .label { color:#9aa3ba; }
    pre { margin:0; white-space:pre-wrap; word-break:break-all; }
    .ok { color:#22c55e; }
    .bad { color:#ef4444; }
  </style>
  <script>
    const $ = (id)=>document.getElementById(id);
    const b64u = {
      decode(s){
        s = s.replace(/-/g,'+').replace(/_/g,'/');
        const pad = s.length % 4 === 2 ? '==' : s.length % 4 === 3 ? '=' : '';
        try { return atob(s + pad); } catch(e) { return ''; }
      },
      toUint8(s){ return new TextEncoder().encode(s); },
      fromUint8(b){ return Array.from(b).map(x=>String.fromCharCode(x)).join(''); }
    };
    function parseJWT(token){
      const parts = token.split('.');
      if(parts.length !== 3) return { ok:false, err:ToolkitI18n.translate('jwt.invalidFormat') };
      try{
        const header = JSON.parse(b64u.decode(parts[0]));
        const payload = JSON.parse(b64u.decode(parts[1]));
        const signature = parts[2];
        return { ok:true, header, payload, signature, signingInput: parts[0]+'.'+parts[1] };
      }catch(e){
        return { ok:false, err: ToolkitI18n.translate('jwt.decodeFailed')+': '+String(e) };
      }
    }
    async function hmacVerify(alg, secret, signingInput, signatureB64u){
      const map = { HS256: 'SHA-256', HS384: 'SHA-384', HS512: 'SHA-512' };
      const hash = map[alg]; if(!hash) return { ok:false, err:ToolkitI18n.translate('jwt.unsupported') };
      const key = await crypto.subtle.importKey('raw', b64u.toUint8(secret), { name:'HMAC', hash }, false, ['sign']);
      const sig = await crypto.subtle.sign('HMAC', key, b64u.toUint8(signingInput));
      // 转 base64url
      const bin = new Uint8Array(sig);
      let b64 = btoa(b64u.fromUint8(bin)).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
      const match = b64 === signatureB64u;
      return { ok: match, calc: b64 };
    }
    function render(){
      const t = $('token').value.trim();
      const areaH = $('header'); const areaP = $('payload'); const areaS = $('status');
      if(!t){ areaH.textContent=''; areaP.textContent=''; areaS.innerHTML=''; return; }
      const r = parseJWT(t);
      if(!r.ok){ areaH.textContent=''; areaP.textContent=''; areaS.innerHTML = `<span class=\"bad\">${r.err}</span>`; return; }
      areaH.textContent = JSON.stringify(r.header, null, 2);
      areaP.textContent = JSON.stringify(r.payload, null, 2);
      $('alg').value = r.header.alg || 'HS256';
      // 校验（可选）
      const secret = $('secret').value;
      if(secret && String(r.header.alg||'').startsWith('HS')){
        hmacVerify(r.header.alg, secret, r.signingInput, r.signature).then(res=>{
          areaS.innerHTML = res.ok ? `<span class=\"ok\">${ToolkitI18n.translate('jwt.valid')} (${r.header.alg})</span>` : `<span class=\"bad\">${ToolkitI18n.translate('jwt.invalid')}</span>`;
        }).catch(()=>{ areaS.innerHTML = `<span class=\"bad\">${ToolkitI18n.translate('jwt.verifyError')}</span>`; });
      }else{
        areaS.innerHTML = `<span class="label">${ToolkitI18n.translate('jwt.notVerified')}</span>`;
      }
    }
    function bind(){
      ['token','secret','alg'].forEach(id=>$(id).addEventListener('input', render));
      render();
      document.addEventListener('toolkit:languagechange', render);
    }
    document.addEventListener('DOMContentLoaded', bind);
  </script>
</head>
<body>
  <header class="tool-header" data-site-header>
    <a class="back" href="../../index.html">&lt; 返回首页</a>
    <div class="tool-title">JWT 在线解码与校验（不上传）</div>
    <div class="tool-bar"><button type="button" data-language-toggle>中 / EN</button></div>
  </header>

  <div class="toolbar full">
    <div class="label" data-i18n="jwt.local">在本地解析，不发送到服务器</div>
  </div>

  <div class="layout">
    <div class="card full">
      <div class="label" style="margin-bottom:6px;" data-i18n="jwt.paste">粘贴 JWT</div>
      <textarea id="token" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." rows="3"></textarea>
      <div class="row" style="margin-top:8px;">
        <span class="label" data-i18n="jwt.algorithm">算法</span>
        <select id="alg" style="width:auto;">
          <option>HS256</option>
          <option>HS384</option>
          <option>HS512</option>
        </select>
        <span class="label" data-i18n="jwt.secret">Secret（可选，用于校验）</span>
        <input id="secret" placeholder="输入 HMAC Secret 进行校验" data-i18n-placeholder="jwt.secretPlaceholder" />
      </div>
      <div id="status" style="margin-top:8px;"></div>
    </div>

    <div class="card">
      <div class="label">Header</div>
      <pre id="header"></pre>
    </div>
    <div class="card">
      <div class="label">Payload</div>
      <pre id="payload"></pre>
    </div>
  </div>
  <script src="../../assets/js/i18n.js"></script><script>ToolkitI18n.registerTranslations({'zh-CN':{'jwt.invalidFormat':'格式错误，应为三段 header.payload.signature','jwt.decodeFailed':'解码失败','jwt.unsupported':'不支持的算法','jwt.valid':'签名有效','jwt.invalid':'签名无效','jwt.verifyError':'校验异常','jwt.notVerified':'未校验签名（填写 Secret 并选择 HS 算法可校验）','jwt.local':'在本地解析，不发送到服务器','jwt.paste':'粘贴 JWT','jwt.algorithm':'算法','jwt.secret':'Secret（可选，用于校验）','jwt.secretPlaceholder':'输入 HMAC Secret 进行校验'},en:{'jwt.invalidFormat':'Invalid format; expected header.payload.signature','jwt.decodeFailed':'Decoding failed','jwt.unsupported':'Unsupported algorithm','jwt.valid':'Valid signature','jwt.invalid':'Invalid signature','jwt.verifyError':'Verification error','jwt.notVerified':'Signature not verified (enter a Secret and use an HS algorithm)','jwt.local':'Parsed locally and never sent to a server','jwt.paste':'Paste JWT','jwt.algorithm':'Algorithm','jwt.secret':'Secret (optional, for verification)','jwt.secretPlaceholder':'Enter an HMAC Secret to verify'}});document.addEventListener('toolkit:languagechange',()=>{});window.ToolkitPage={root:'../../',tool:true,titleZh:'JWT 解码与校验',titleEn:'JWT Inspector'};</script><script src="../../assets/js/site-shell.js"></script>
</body>
</html>
