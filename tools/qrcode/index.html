<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>二维码生成器</title>
  <link rel="stylesheet" href="../../assets/css/base.css" />
</head>
<body>
  <header data-site-header><a class="back" href="../../index.html">&lt; 返回首页</a><button data-language-toggle>中 / EN</button></header>
  <div class="iframe-wrap">
    <iframe id="qrFrame" class="iframe" src="../../free-tools-collection/qrcodejs/index.html" title="QR Code Generator"></iframe>
  </div>
  <script src="../../assets/js/i18n.js"></script><script>window.ToolkitPage={root:'../../',tool:true,titleZh:'二维码生成器',titleEn:'QR Code Generator'};</script><script src="../../assets/js/site-shell.js"></script>
  <script>
    const qrFrame=document.querySelector('#qrFrame');
    function sendQrLanguage(){qrFrame.contentWindow?.postMessage({type:'toolkit-language',language:ToolkitI18n.getLanguage()},location.origin)}
    qrFrame.addEventListener('load',sendQrLanguage);
    document.addEventListener('toolkit:languagechange',sendQrLanguage);
  </script>
</body>
</html>
